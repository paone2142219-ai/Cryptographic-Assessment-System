# /etc/ssh/sshd_config.d/sftp.conf — ftpsrv
#
# Servizio SFTP in DMZ per il trasferimento file con utenti esterni.
# L'utente sftpuser è confinato (chroot) nella propria home, non ha una
# shell di login, e può solo fare SFTP — nessun accesso SSH interattivo.
# Solo autenticazione a chiave pubblica: la rete interna resta isolata,
# il controllo degli accessi resta comunque demandato al firewall
# perimetrale (mainfw) per qualunque traffico che raggiunga la DMZ.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519


Match User sftpuser
    ChrootDirectory /home/sftpuser
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
