# /etc/swanctl/conf.d/site-to-site.conf — vpnremote
# Speculare a vpnlocal/etc/swanctl/conf.d/site-to-site.conf — vedi lì per
# la motivazione delle scelte (auth a certificato, PFS obbligatoria su ogni
# rekey della Child SA).

connections {
    site-to-site {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384

        local_addrs  = 10.5.0.2
        remote_addrs = 10.5.0.1

        local {
            auth = pubkey
            certs = cert.pem
            id = "vpnremote.katharalab.local"
        }
        remote {
            auth = pubkey
            id = "vpnlocal.katharalab.local"
        }

        children {
            site-to-site {
                local_ts  = 192.168.0.0/24
                remote_ts = 10.1.0.0/24,10.2.0.0/24,10.4.0.0/24

                esp_proposals = aes256gcm16-ecp256

                start_action = start
                dpd_action   = restart

                rekey_time  = 20m
                life_time   = 25m
                rand_time   = 3m
            }
        }

        dpd_delay = 20s
    }
}
