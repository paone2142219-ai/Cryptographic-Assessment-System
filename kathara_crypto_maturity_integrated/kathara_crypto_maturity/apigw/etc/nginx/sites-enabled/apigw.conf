# /etc/nginx/sites-available/apigw.conf
#
# API Gateway esposto in DMZ. TLS 1.3 esclusivo (nessun fallback a 1.2):
# elimina per costruzione l'intera classe di problemi legati a CBC,
# rinegoziazione, e cipher suite RSA-only prive di forward secrecy — in
# TLS 1.3 ogni cipher suite è AEAD e ogni handshake completo porta un
# key_share (EC)DHE fresco (vedi nota su has_pfs in normalizer.py per la
# sola eccezione della ripresa PSK-only).

server {
    listen 443 ssl http2;
    server_name apigw.katharalab.local;

    ssl_certificate     /etc/pki/cert.pem;
    ssl_certificate_key /etc/pki/key.pem;

    ssl_protocols TLSv1.3;
    ssl_conf_command Options KTLS;

    # Cipher suite TLS 1.3 esplicite (formato IANA), tutte AEAD.
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    ssl_session_tickets off;   # niente resumption PSK-only: ogni sessione ha PFS piena

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        root /var/www/html;
        index index.html;
    }

    location /api/health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"apigw","tls":"1.3"}';
    }

    # Bridge verso il service mesh (svca/svcb): nginx termina qui il TLS
    # 1.3 lato client e inoltra in HTTP semplice, su loopback, al processo
    # grpc_proxy.py (127.0.0.1:8080) che apre lui il canale gRPC/mTLS reale
    # verso il mesh (vedi apigw.startup e /opt/gw/grpc_proxy.py).
    location /api/mesh/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# Redirect HTTP -> HTTPS esplicito (nessun servizio in chiaro esposto)
server {
    listen 80;
    server_name apigw.katharalab.local;
    return 301 https://$host$request_uri;
}
