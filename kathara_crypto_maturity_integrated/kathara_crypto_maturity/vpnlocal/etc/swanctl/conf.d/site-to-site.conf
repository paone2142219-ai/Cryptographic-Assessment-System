# /etc/swanctl/conf.d/site-to-site.conf — vpnlocal
#
# Tunnel IPsec permanente verso la sede remota (vpnremote). A differenza del
# road warrior, qui si usa autenticazione a certificato (ECDSA P-256, CA di
# laboratorio) anziché PSK: è la scelta più matura per un collegamento
# site-to-site duraturo, non soggetto a rotazione manuale di una chiave
# condivisa.
#
# Punto qualificante: esp_proposals include ecp256 anche sul figlio (Child
# SA), non solo su IKE — questo garantisce che OGNI rekey della Child SA
# porti un payload KE fresco (vedi discussione su CREATE_CHILD_SA e PFS),
# non solo la IKE SA. Senza questo, i rekey della Child SA userebbero
# solamente prf+(SK_d, Ni|Nr), senza alcuna Perfect Forward Secrecy.

connections {
    site-to-site {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384

        local_addrs  = 10.5.0.1
        remote_addrs = 10.5.0.2

        local {
            auth = pubkey
            certs = cert.pem
            id = "vpnlocal.katharalab.local"
        }
        remote {
            auth = pubkey
            id = "vpnremote.katharalab.local"
        }

        children {
            site-to-site {
                local_ts  = 10.1.0.0/24,10.2.0.0/24,10.4.0.0/24
                remote_ts = 192.168.0.0/24

                # AEAD sul piano dati + gruppo ECP-256 esplicito: OGNI
                # rekey della Child SA porta un fresh key-share, PFS
                # genuina ad ogni rinnovo, non solo alla creazione iniziale.
                esp_proposals = aes256gcm16-ecp256

                start_action = start
                dpd_action   = restart

                rekey_time  = 20m
                life_time   = 25m
                rand_time   = 3m
            }
        }

        dpd_delay = 20s
    }
}
