# /etc/swanctl/conf.d/road-warrior.conf — clientext
#
# Due profili di connessione verso lo stesso concentratore (mainfw), che
# differiscono solo per l'identità locale dichiarata: è quell'identità che
# mainfw usa per selezionare il profilo lato server (rw-employee/rw-admin)
# e quindi il pool IP da cui assegnare l'indirizzo virtuale. Per collegarsi:
#   swanctl --initiate --child rw-employee-child   (identità employee)
#   swanctl --initiate --child rw-admin-child       (identità admin)

connections {
    rw-employee {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384
        remote_addrs = 10.0.0.1
        vips = 0.0.0.0

        local {
            auth = psk
            id = "alice@employee.katharalab.local"
        }
        remote {
            auth = psk
            id = mainfw.katharalab.local
        }

        children {
            rw-employee-child {
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16-ecp384
                start_action = none
            }
        }
    }

    rw-admin {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384
        remote_addrs = 10.0.0.1
        vips = 0.0.0.0

        local {
            auth = psk
            id = "bob@admin.katharalab.local"
        }
        remote {
            auth = psk
            id = mainfw.katharalab.local
        }

        children {
            rw-admin-child {
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16-ecp384
                start_action = none
            }
        }
    }
}
