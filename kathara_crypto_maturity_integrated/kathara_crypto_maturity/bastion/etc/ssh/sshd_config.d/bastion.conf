# /etc/ssh/sshd_config.d/bastion.conf — bastion
#
# Bastion host: unico punto di ingresso amministrativo verso la LAN interna
# e (per il pool admin del road-warrior) verso la rete di management.
# Hardening minimo per un caso d'uso di assessment crittografico: algoritmi
# moderni espliciti, niente password, niente root diretto.

Port 22
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Solo algoritmi non deprecati — coerente con quanto il framework CBOM
# valuta come SAFE/MARGINAL sulle dimensioni KEX/CIPHER/MAC/HOSTKEY.
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes256-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,ecdsa-sha2-nistp256

# Consente il ProxyJump verso la LAN interna (appserver/backupsrv/logserver)
AllowTcpForwarding yes
GatewayPorts no
X11Forwarding no

# Logging esplicito per la telemetria SSH (auth_attempts, host_key, ecc. —
# vedi pipeline_cbom/ssh_parser.py)
LogLevel VERBOSE
