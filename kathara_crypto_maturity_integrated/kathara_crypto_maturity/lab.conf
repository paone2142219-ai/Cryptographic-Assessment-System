LAB_DESCRIPTION="Stima della maturità crittografica — topologia enterprise (VPN road warrior, site-to-site, bastion SSH, API GW TLS 1.3, service mesh mTLS/gRPC, SMTP STARTTLS, SFTP, syslog TLS)"
LAB_VERSION=1.0
LAB_AUTHOR="CBOM Enrichment via Ontological Modeling e Graph Database — Sapienza Università di Roma"

# ── clientext — client road-warrior esterno ──────────────────────────────
clientext[0]="netinternet"
clientext[image]="kathara-crypto-maturity/strongswan:latest"

# ── mainfw — firewall perimetrale + concentratore IPsec road-warrior ────
mainfw[0]="netinternet"
mainfw[1]="netfwdmz"
mainfw[2]="netvpnlocal"
mainfw[3]="netmgmt"
mainfw[image]="kathara-crypto-maturity/strongswan:latest"

# ── dmzgw — gateway DMZ ───────────────────────────────────────────────────
dmzgw[0]="netfwdmz"
dmzgw[1]="netdmz"
dmzgw[image]="kathara-crypto-maturity/router:latest"

# ── apigw — API gateway TLS 1.3, dual-homed DMZ + service mesh ──────────
# Da questa revisione apigw è anche client mTLS applicativo del mesh:
# location /api/mesh/* (nginx) -> grpc_proxy.py (127.0.0.1:8080) -> gRPC/mTLS
# verso svca/svcb, con il certificato apigw già esistente (client+serverAuth).
# Vedi README.md, caso d'uso 9.
apigw[0]="netdmz"
apigw[1]="netmesh"
apigw[image]="kathara-crypto-maturity/nginx-tls:latest"

# ── mailsrv — mail server DMZ (STARTTLS) ─────────────────────────────────
mailsrv[0]="netdmz"
mailsrv[image]="kathara-crypto-maturity/postfix:latest"

# ── ftpsrv — SFTP server DMZ ──────────────────────────────────────────────
ftpsrv[0]="netdmz"
ftpsrv[image]="kathara-crypto-maturity/sftp:latest"

# ── vpnlocal — gateway IPsec site-to-site locale ─────────────────────────
vpnlocal[0]="netvpnlocal"
vpnlocal[1]="nettunnel"
vpnlocal[image]="kathara-crypto-maturity/strongswan:latest"

# ── vpnremote — gateway IPsec site-to-site remoto ────────────────────────
vpnremote[0]="nettunnel"
vpnremote[1]="netremote"
vpnremote[image]="kathara-crypto-maturity/strongswan:latest"

# ── remotehost — host rappresentativo della sede remota ─────────────────
remotehost[0]="netremote"
remotehost[image]="kathara-crypto-maturity/plain:latest"

# ── bastion — bastion host SSH + collector CBOM ──────────────────────────
bastion[0]="netmgmt"
bastion[1]="netbstfw"
bastion[image]="kathara-crypto-maturity/bastion:latest"
# Interfaccia bridged: aggiunge un'interfaccia NAT verso l'host (DHCP
# automatico) per l'accesso a Internet a runtime — utile per aggiornamenti
# o troubleshooting dal nodo di gestione. Va abbinata al fix DNS in
# bastion.startup (il DHCP del bridge non garantisce da solo una risoluzione
# nomi funzionante dentro il container). Per estendere l'accesso a un'altra
# macchina: aggiungere "<nome>[bridged]=\"true\"" e lo stesso fix DNS nel
# relativo .startup — vedi TUTORIAL.md.
bastion[bridged]="true"

# ── internalgw — gateway LAN interna ──────────────────────────────────────
internalgw[0]="netbstfw"
internalgw[1]="netlan"
internalgw[image]="kathara-crypto-maturity/router:latest"

# ── appserver — application server ────────────────────────────────────────
appserver[0]="netlan"
appserver[image]="kathara-crypto-maturity/appserver:latest"

# ── backupsrv — server di backup ──────────────────────────────────────────
backupsrv[0]="netlan"
backupsrv[image]="kathara-crypto-maturity/sftp:latest"

# ── logserver — syslog server cifrato (TLS) ──────────────────────────────
logserver[0]="netlan"
logserver[image]="kathara-crypto-maturity/rsyslog-tls:latest"

# ── svca / svcb — microservizi service mesh (gRPC + mTLS) ───────────────
svca[0]="netmesh"
svca[image]="kathara-crypto-maturity/grpc-mesh:latest"

svcb[0]="netmesh"
svcb[image]="kathara-crypto-maturity/grpc-mesh:latest"
