# /etc/ssh/sshd_config.d/appserver.conf — appserver
#
# sshd qui esiste per un solo scopo: essere il secondo salto del
# ProxyJump amministrativo dal bastion (ssh -J admin@10.3.0.2 admin@10.2.0.10).
# L'accesso di rete è ristretto al solo bastion via iptables (vedi
# appserver.startup) — questa configurazione irrobustisce il servizio
# stesso, come seconda linea di difesa indipendente dal controllo di rete.

PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
AllowTcpForwarding no
X11Forwarding no