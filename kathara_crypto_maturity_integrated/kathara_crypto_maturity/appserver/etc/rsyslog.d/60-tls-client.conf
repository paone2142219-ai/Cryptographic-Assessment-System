# /etc/rsyslog.d/60-tls-client.conf
# Spedisce tutti i log verso logserver via TLS (RFC 5425). Autenticazione
# TLS solo lato server (AuthMode anon): il client valida l'identità di
# logserver tramite la CA di laboratorio, ma non presenta un proprio
# certificato. Per passare a mTLS anche qui basterebbe emettere un
# certificato client con gen_pki.sh e impostare AuthMode="x509/name".

global(
    DefaultNetstreamDriver="gtls"
    DefaultNetstreamDriverCAFile="/etc/pki/ca.pem"
)

action(type="omfwd"
       Target="10.2.0.12"
       Port="6514"
       Protocol="tcp"
       StreamDriver="gtls"
       StreamDriverMode="1"
       StreamDriverAuthMode="anon")
