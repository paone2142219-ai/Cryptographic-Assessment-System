# /etc/swanctl/conf.d/road-warrior.conf — mainfw
#
# Concentratore VPN Road Warrior IPsec/IKEv2. Autenticazione PSK per-identità
# (ogni utente ha un proprio ID e una propria chiave pre-condivisa, definiti
# in secrets.conf): l'identità determina quale dei due profili di connessione
# viene selezionato da strongSwan in fase di IKE_AUTH, e con essa il pool IP
# da cui viene assegnato l'indirizzo virtuale — è questo il meccanismo con
# cui il controllo degli accessi differenziato employee/admin diventa
# nativamente IP-based (vedi opt/firewall/road-warrior-acl.sh).
#
# Proposte crittografiche: AES-256-GCM (AEAD, nessun MAC separato), PRF
# HMAC-SHA-384, gruppo ECP-384 per IKE. Scelta deliberatamente robusta sul
# piano classico; il gruppo resta comunque non post-quantum-safe (vulnerabile
# a Shor) — coerente con l'assessment del framework CBOM, che lo classifica
# come VULNERABLE sulla dimensione KEX pur con CIPHER/MAC in stato SAFE.

connections {

    rw-employee {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384

        local {
            auth = psk
            id = mainfw.katharalab.local
        }
        remote {
            auth = psk
            id = "*@employee.katharalab.local"
        }

        children {
            rw-employee-child {
                local_ts  = 0.0.0.0/0
                esp_proposals = aes256gcm16-ecp384
                rekey_time = 30m
                dpd_action = clear
                start_action = none
            }
        }

        pools = employee-pool
        dpd_delay = 30s
    }

    rw-admin {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384

        local {
            auth = psk
            id = mainfw.katharalab.local
        }
        remote {
            auth = psk
            id = "*@admin.katharalab.local"
        }

        children {
            rw-admin-child {
                local_ts  = 0.0.0.0/0
                esp_proposals = aes256gcm16-ecp384
                rekey_time = 30m
                dpd_action = clear
                start_action = none
            }
        }

        pools = admin-pool
        dpd_delay = 30s
    }
}

pools {
    employee-pool {
        addrs = 10.9.1.0/24
    }
    admin-pool {
        addrs = 10.9.2.0/24
    }
}
