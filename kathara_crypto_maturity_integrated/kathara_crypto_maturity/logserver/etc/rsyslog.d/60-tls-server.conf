# /etc/rsyslog.d/60-tls-server.conf — logserver
#
# Caso d'uso "Syslog cifrato": logserver riceve i log di tutta la LAN
# interna esclusivamente su un canale TLS (porta 6514, la porta IANA
# standard per syslog-over-TLS, RFC 5425). Il driver è GnuTLS (gtls),
# fornito dal pacchetto rsyslog-gnutls.

module(load="imtcp"
       StreamDriver.Name="gtls"
       StreamDriver.Mode="1"
       StreamDriver.Authmode="anon")

global(
    DefaultNetstreamDriver="gtls"
    DefaultNetstreamDriverCAFile="/etc/pki/ca.pem"
    DefaultNetstreamDriverCertFile="/etc/pki/cert.pem"
    DefaultNetstreamDriverKeyFile="/etc/pki/key.pem"
)

input(type="imtcp" port="6514")

# Log organizzati per host mittente e per facility/programma sorgente.
template(name="RemoteLogs" type="string"
          string="/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log")

if $inputname == "imtcp" then {
    action(type="omfile" DynaFile="RemoteLogs")
    stop
}
